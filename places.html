<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Places photography by MFONI."><title>Places — MFONI</title><link rel="stylesheet" href="styles.css">
<style>
:root{--paper:#f8f8f6;--ink:#171717}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.site-header{padding:28px clamp(20px,5vw,76px);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.brand{font-size:22px;font-weight:750;letter-spacing:-.055em;text-decoration:none;color:inherit}.site-nav{display:flex;gap:clamp(14px,2.3vw,34px);flex-wrap:wrap}.site-nav a{font-size:13px;color:inherit;text-decoration:none}.site-nav a[aria-current]{text-decoration:underline;text-underline-offset:5px}main{padding:0 clamp(20px,5vw,76px) 90px}.intro{padding:70px 0 75px;max-width:900px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(64px,12vw,170px);letter-spacing:-.085em;line-height:.9;margin:22px 0 28px;font-weight:500}.intro p{font-size:clamp(16px,2vw,23px);line-height:1.5;max-width:570px}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,68px);align-items:start}.photo{padding:0;border:0;background:transparent;text-align:left;cursor:zoom-in;color:inherit;font:inherit}.photo img{width:100%;height:auto;display:block;object-fit:cover}.photo span{display:block;font-size:13px;margin-top:13px}.photo:nth-child(3n){margin-top:80px}.back{display:inline-block;margin-top:72px;color:inherit;text-underline-offset:4px;font-size:14px}footer{padding:26px clamp(20px,5vw,76px);border-top:1px solid #d9d9d5;display:flex;justify-content:space-between;gap:20px;font-size:12px}dialog{padding:0;border:0;background:#111;color:white;max-width:95vw;max-height:95vh}dialog::backdrop{background:rgba(0,0,0,.92)}.viewer{display:flex;flex-direction:column;align-items:center;padding:40px 20px 20px}.viewer img{max-width:88vw;max-height:75vh;object-fit:contain}.viewer button{position:absolute;top:10px;right:15px;background:none;border:0;color:white;font-size:28px;cursor:pointer}.viewer p{font-size:13px}@media(max-width:650px){.intro{padding:42px 0 50px}.gallery-grid{grid-template-columns:1fr;gap:34px}.photo:nth-child(3n){margin-top:0}.site-header{padding-top:20px}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html">MFONI</a><nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="people.html" >People</a><a href="places.html" aria-current="page">Places</a><a href="moments.html" >Moments</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></header>
<main><section class="intro"><span class="eyebrow">Selected work / Places</span><h1>Places.</h1><p>Landscapes, architecture, and somewhere in between.</p></section><section class="gallery-grid" aria-label="Places gallery"><button class="photo" type="button" data-src="images/IMG_3264.jpg" data-title="Through the arches" aria-label="View Through the arches"><img src="images/IMG_3264.jpg" alt="Through the arches" loading="lazy"><span>Through the arches</span></button>
<button class="photo" type="button" data-src="images/DSC08057.jpg" data-title="Under glass" aria-label="View Under glass"><img src="images/DSC08057.jpg" alt="Under glass" loading="lazy"><span>Under glass</span></button>
<button class="photo" type="button" data-src="images/DSC07982.jpg" data-title="In bloom" aria-label="View In bloom"><img src="images/DSC07982.jpg" alt="In bloom" loading="lazy"><span>In bloom</span></button>
<button class="photo" type="button" data-src="images/DSC08096.jpg" data-title="Reflections" aria-label="View Reflections"><img src="images/DSC08096.jpg" alt="Reflections" loading="lazy"><span>Reflections</span></button>
<button class="photo" type="button" data-src="images/IMG_6285.jpg" data-title="By the water" aria-label="View By the water"><img src="images/IMG_6285.jpg" alt="By the water" loading="lazy"><span>By the water</span></button>
<button class="photo" type="button" data-src="images/DSC08092.jpg" data-title="Details" aria-label="View Details"><img src="images/DSC08092.jpg" alt="Details" loading="lazy"><span>Details</span></button></section><a class="back" href="index.html">← Back to selected work</a></main>
<footer><span>© <span id="year"></span> MFONI</span><a href="https://www.instagram.com/_mfoni/" style="color:inherit">Instagram ↗</a></footer>
<dialog id="lightbox" aria-label="Photo viewer"><div class="viewer"><button type="button" id="close" aria-label="Close photo">×</button><img alt=""><p id="caption"></p></div></dialog>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const dialog=document.getElementById('lightbox');const viewer=dialog.querySelector('img');const caption=document.getElementById('caption');const cards=[...document.querySelectorAll('.photo')];let active=0;
function show(i){active=(i+cards.length)%cards.length;viewer.src=cards[active].dataset.src;viewer.alt=cards[active].dataset.title;caption.textContent=cards[active].dataset.title+' — '+(active+1)+' / '+cards.length;}
cards.forEach((card,i)=>card.addEventListener('click',()=>{show(i);dialog.showModal()}));
document.getElementById('close').addEventListener('click',()=>dialog.close());
document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight')show(active+1);if(e.key==='ArrowLeft')show(active-1)});
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
